name: Build VoltMatch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "CREDITS.txt;." --name VoltMatch main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltmatch-windows-exe
          path: dist/VoltMatch.exe

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 wget patchelf python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build one-folder Linux bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "CREDITS.txt:." --name VoltMatch main.py

      - name: Prepare AppImage AppDir
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp -r dist/VoltMatch/* AppDir/usr/bin/
          cat > AppDir/VoltMatch.desktop <<'EOF'
[Desktop Entry]
Type=Application
Name=VoltMatch
Exec=VoltMatch
Icon=voltmatch
Terminal=false
Categories=Utility;Science;Engineering;
EOF
          cp assets/voltmatch.png AppDir/
          cat > AppDir/AppRun <<'EOF'
#!/bin/bash
HERE="$(dirname "$(readlink -f "$0")")"
exec "$HERE/usr/bin/VoltMatch" "$@"
EOF
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -O appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool.AppImage AppDir VoltMatch-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltmatch-linux-appimage
          path: VoltMatch-x86_64.AppImage
