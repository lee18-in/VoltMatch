name: Build VoltMatch

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "CREDITS.txt;." --name VoltMatch main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltmatch-windows-exe
          path: dist/VoltMatch.exe

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2 wget patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build one-folder bundle
        run: |
          pyinstaller --noconfirm --onedir --name VoltMatch --add-data "CREDITS.txt:." main.py

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/VoltMatch/* AppDir/usr/bin/
          cp assets/voltmatch.png AppDir/voltmatch.png
          printf '[Desktop Entry]\nType=Application\nName=VoltMatch\nExec=VoltMatch\nIcon=voltmatch\nTerminal=false\nCategories=Utility;Science;Engineering;\n' > AppDir/VoltMatch.desktop
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/VoltMatch" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -O appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage AppDir VoltMatch-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltmatch-linux-appimage
          path: VoltMatch-x86_64.AppImage

  release:
    name: Publish Release
    needs: [build-windows, build-linux-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VoltMatch $GITHUB_REF_NAME" \
            --generate-notes \
            "artifacts/voltmatch-windows-exe/VoltMatch.exe#VoltMatch.exe (Windows)" \
            "artifacts/voltmatch-linux-appimage/VoltMatch-x86_64.AppImage#VoltMatch-x86_64.AppImage (Linux)"
